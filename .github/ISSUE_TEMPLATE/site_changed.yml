name: Site changed / selectors broke
description: Wellfound changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        wellfound.com moved.

        Useful to know before filing: a landing page is read from the
        normalised Apollo cache in `__NEXT_DATA__`, and a job page from its
        one schema.org `JobPosting` block. The row's `data_source` column
        (`apollo` / `jsonld`) says which one was read, and which one broke
        narrows the fix a lot.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Jobs (0 rows on a page that visibly has jobs)
        - A specific field is null or wrong (salary, equity, sku, company, URL)
        - The landing row and the job page disagree about a job
        - Pagination stops early, repeats a page, or stops with page_echo_mismatch
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact URL, and what kind of exit IP it was fetched from.
      placeholder: "https://wellfound.com/role/r/software-engineer (exit IP: US residential)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - A `--dump-html` capture of the page, or the relevant part of it:
          the `__NEXT_DATA__` script on a landing page, the
          `application/ld+json` `JobPosting` on a job page.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
